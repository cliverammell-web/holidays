<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trips</title>
<meta name="theme-color" content="#123C6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --paper:#DDEBF9;        /* light sky background */
  --card:#FFFFFF;
  --ink:#0E2A47;          /* dark navy text */
  --muted:#5B7B9C;
  --line:#BBD5EE;
  --accent:#123C6B;       /* dark blue — buttons */
  --accent-hi:#1B5A9E;    /* mid blue — fills, active state */
  --accent-soft:#D0E4F7;
  --warn:#A62B1F;
  --r:10px;
  --pad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}

/* ---------- header ---------- */
header{
  background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) var(--pad) 12px;
  position:sticky;top:0;z-index:20;
}
.tripbar{display:flex;align-items:center;gap:8px}
.trippick{position:relative;flex:1;min-width:0}
.trippick select{
  width:100%;border:1px solid var(--line);background:#F1F7FD;border-radius:9px;
  font-family:Georgia,"Times New Roman",serif;font-size:20px;color:var(--ink);
  padding:8px 34px 8px 11px;appearance:none;-webkit-appearance:none;
  text-overflow:ellipsis;cursor:pointer;
}
.trippick select:focus{outline:2px solid var(--accent);outline-offset:1px}
.trippick::after{
  content:"";position:absolute;right:13px;top:50%;width:9px;height:9px;
  border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);
  transform:translateY(-70%) rotate(45deg);pointer-events:none;
}
.tripcount{font-size:12.5px;color:var(--muted);margin-top:6px}
.iconbtn{
  border:1px solid var(--line);background:var(--card);border-radius:8px;
  width:36px;height:36px;flex:0 0 36px;font-size:19px;line-height:1;
  cursor:pointer;color:var(--accent);
}
.iconbtn:active{background:var(--accent-soft)}

.userchip{
  display:flex;align-items:center;gap:7px;margin-top:9px;
  background:var(--accent-soft);border:1px solid var(--line);
  border-radius:999px;padding:4px 5px 4px 11px;font-size:13px;
  color:var(--accent);width:fit-content;max-width:100%;
}
.userchip b{font-weight:600}
.userchip button{
  border:0;background:var(--accent);color:#fff;border-radius:999px;
  padding:3px 10px;font-size:12px;cursor:pointer;
}

/* journey rule */
.journey{margin-top:12px}
.jrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.jend{font-size:12.5px;color:var(--muted);min-width:0;flex:1}
.jend b{display:block;color:var(--ink);font-size:14px;font-weight:600;white-space:nowrap}
.jend.right{text-align:right}
.jbox{
  flex:0 0 auto;text-align:center;background:var(--accent);color:#fff;
  border-radius:10px;padding:6px 14px;line-height:1.15;
}
.jbox b{display:block;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.jbox span{display:block;font-size:11px;opacity:.85;white-space:nowrap}
.jbox.quiet{background:var(--accent-soft);color:var(--accent)}
.jbox.quiet b{font-size:15px;font-weight:600}
.jtrack{position:relative;height:2px;background:var(--line);margin:11px 0 0}
.jfill{position:absolute;left:0;top:0;height:2px;background:var(--accent-hi)}
.jdot{position:absolute;top:-4px;width:10px;height:10px;border-radius:50%;
  background:var(--accent);border:2px solid var(--card);transform:translateX(-5px)}

/* ---------- tabs ---------- */
nav{
  display:flex;gap:2px;overflow-x:auto;background:var(--card);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:19;
  scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto;border:0;background:none;padding:11px 13px;
  font-size:14.5px;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;
}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

main{padding:var(--pad);max-width:640px;margin:0 auto}

/* ---------- shared ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.cardhead{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 12px;border-bottom:1px solid var(--line);background:#EFF6FD;
}
.cardhead h3{font-size:14.5px}
.count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.addrow{display:flex;gap:6px;margin-bottom:6px}
.addrow.second{margin-bottom:12px}
.addrow input,.addrow select{
  flex:1;min-width:0;padding:11px 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);
}
.btn{
  border:0;background:var(--accent);color:#fff;border-radius:8px;
  padding:11px 15px;font-weight:600;cursor:pointer;flex:0 0 auto;
}
.btn:active{opacity:.85}
.btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--line)}

ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
ul.list li:last-child{border-bottom:0}
ul.list li.done .txt{color:var(--muted);text-decoration:line-through}
.chk{
  flex:0 0 22px;width:22px;height:22px;margin-top:1px;border:1.5px solid var(--line);
  border-radius:6px;background:var(--card);cursor:pointer;font-size:14px;
  line-height:1;color:var(--accent);padding:0;
}
.chk[data-on="1"]{background:var(--accent);border-color:var(--accent);color:#fff}
.txt{flex:1;min-width:0;word-break:break-word}
.sub{display:block;font-size:12.5px;color:var(--muted)}
.sub.late{color:var(--warn);font-weight:600}
.datebtn{
  display:block;margin-top:2px;padding:0 0 1px;border:0;border-bottom:1px dashed var(--line);
  background:none;font-size:12.5px;color:var(--muted);cursor:pointer;text-align:left;
}
.datebtn.late{color:var(--warn);font-weight:600;border-bottom-color:var(--warn)}
.donehead{
  display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:11px 12px;border:0;background:#EFF6FD;cursor:pointer;
  font-size:14.5px;font-weight:600;color:var(--ink);text-align:left;
}
.donehead + ul.list{border-top:1px solid var(--line)}
.caret{
  width:9px;height:9px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);
  transform:translateY(-2px) rotate(45deg);transition:transform .15s;
}
.caret.up{transform:translateY(2px) rotate(-135deg)}
@media (prefers-reduced-motion:reduce){.caret{transition:none}}
.del{flex:0 0 auto;border:0;background:none;color:var(--muted);font-size:17px;cursor:pointer;padding:0 2px;line-height:1}

.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px dashed var(--line)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip:active{background:var(--accent-soft);border-color:var(--accent)}
.chiphead{font-size:12.5px;color:var(--muted);padding:10px 12px 0}

.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14.5px}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:3px}

.stub{padding:20px 14px}
.stub h3{font-size:16px;margin-bottom:6px}
.stub p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.stub ul{margin:0;padding-left:19px;color:var(--muted);font-size:14.5px}
.stub li{margin-bottom:5px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.toolbar .btn{flex:1 1 auto}

/* ---------- sign in ---------- */
.signin{max-width:420px;margin:34px auto;text-align:center}
.signin h2{font-family:Georgia,serif;font-size:24px;margin-bottom:6px}
.signin p{color:var(--muted);font-size:14.5px;margin:0 0 20px}
.people{display:flex;flex-direction:column;gap:9px}
.person{
  border:1px solid var(--line);background:var(--card);border-radius:var(--r);
  padding:15px;font-size:17px;cursor:pointer;color:var(--ink);text-align:left;
  display:flex;align-items:center;gap:12px;
}
.person:active{border-color:var(--accent);background:var(--accent-soft)}
.avatar{
  flex:0 0 34px;width:34px;height:34px;border-radius:50%;background:var(--accent);
  color:#fff;display:grid;place-items:center;font-size:15px;font-weight:600;
}

dialog{border:0;border-radius:14px;padding:0;width:min(94vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(14,42,71,.5)}
.dlgbody{padding:16px}
.dlgbody h2{font-size:17px;margin-bottom:12px}
.field{margin-bottom:11px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.hint{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
.dlgfoot{display:flex;gap:8px;padding:0 16px 16px}
.dlgfoot .btn{flex:1}
</style>
</head>
<body>

<header id="hdr" hidden>
  <div class="tripbar">
    <div class="trippick"><select id="tripSel" aria-label="Choose which trip to open"></select></div>
    <button class="iconbtn" id="editTrip" title="Edit this trip">&#9998;</button>
    <button class="iconbtn" id="newTrip" title="New trip">+</button>
  </div>
  <div class="tripcount" id="tripCount"></div>
  <div class="userchip" id="userChip"></div>
  <div class="journey" id="journey"></div>
</header>

<nav id="tabs" role="tablist" hidden></nav>
<main id="view"></main>

<dialog id="tripDlg">
  <form method="dialog" class="dlgbody">
    <h2 id="dlgTitle">New trip</h2>
    <div class="field"><label for="f_name">Trip name</label><input id="f_name" placeholder="Christmas in Yorkshire"></div>
    <div class="field"><label for="f_dest">Destination</label><input id="f_dest" placeholder="Harrogate"></div>
    <div class="field"><label for="f_dep">Leaving</label><input id="f_dep" type="date"></div>
    <div class="field"><label for="f_ret">Coming back</label><input id="f_ret" type="date"></div>
    <div class="field"><label for="f_trav">Travelling (comma separated)</label><input id="f_trav" placeholder="Clive, Sue"></div>
    <p class="hint">Everyone named here gets their own packing list and can sign in on this device.</p>
  </form>
  <div class="dlgfoot">
    <button class="btn ghost" id="dlgDelete" type="button">Delete trip</button>
    <button class="btn" id="dlgSave" type="button">Save trip</button>
  </div>
</dialog>

<dialog id="dateDlg">
  <div class="dlgbody">
    <h2>When should this be done?</h2>
    <p class="hint" id="dateJob" style="margin:-8px 0 12px"></p>
    <div class="field"><label for="f_due">Date</label><input id="f_due" type="date"></div>
    <p class="hint" id="dateRel"></p>
  </div>
  <div class="dlgfoot">
    <button class="btn ghost" id="dateCancel" type="button">Cancel</button>
    <button class="btn" id="dateSave" type="button">Set date</button>
  </div>
</dialog>

<script>
"use strict";
/* ============================================================
   Trip Planner — v2
   · Sky-blue palette
   · Sign-in by traveller; the To take list is per person
   · Save as a copy, so old trips stay available for comparison
   Storage: localStorage. Sync-ready model — every record has an
   id + updatedAt and the whole store serialises to one blob.
   ============================================================ */

const KEY = "trips.v1";
const UKEY = "trips.user";          /* who is signed in on THIS device */
const EVERYONE = "Everyone";

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => new Date().toISOString();
const todayISO = () => new Date().toISOString().slice(0, 10);

const TAKE_CATS = ["Documents","Clothes","Toiletries","Tech","Medical","Car","Pet","Other"];

const SEED_TAKE = [
  ["Passports","Documents"],["Driving licence","Documents"],["Insurance details","Documents"],
  ["Boarding passes","Documents"],["Booking confirmations","Documents"],
  ["Underwear","Clothes"],["Socks","Clothes"],["Waterproof","Clothes"],["Walking shoes","Clothes"],
  ["Smart outfit","Clothes"],["Swimming things","Clothes"],
  ["Toothbrush","Toiletries"],["Razor","Toiletries"],["Sun cream","Toiletries"],["Shampoo","Toiletries"],
  ["Phone charger","Tech"],["Plug adapter","Tech"],["Power bank","Tech"],["Headphones","Tech"],
  ["Camera","Tech"],["Kindle","Tech"],
  ["Prescriptions","Medical"],["Painkillers","Medical"],["Plasters","Medical"],
  ["Warning triangles","Car"],["Hi-vis vests","Car"],["Spare bulbs","Car"],["Breakdown cover card","Car"],
  ["Lead and harness","Pet"],["Food and bowls","Pet"],["Vaccination record","Pet"],
  ["Sunglasses","Other"],["Umbrella","Other"],["Cash","Other"]
];
const SEED_BRING = ["Olive oil","Turrón","Cheese","Tea bags","Marmite","Books","Presents","Wine"];
const SEED_TODO = [
  ["Check passports are still in date", -90],
  ["Sort travel insurance", -45],
  ["Book pet care or house sitter", -30],
  ["Tell the bank we're away", -21],
  ["Re-read all booking confirmations", -14],
  ["Arrange currency", -10],
  ["Stop the post and deliveries", -7],
  ["Check in online", -2],
  ["Charge everything", -1],
  ["Empty the fridge", -1],
  ["Bins out", -1],
  ["Water off, windows shut, lock up", 0]
];

/* ---------- store ---------- */
let S = load();
let user = localStorage.getItem(UKEY) || "";

function blankStore(){
  return {
    v: 2, activeTripId: null, trips: [],
    catTake:  SEED_TAKE.map(([name, cat]) => ({ id: uid(), name, cat })),
    catBring: SEED_BRING.map(name => ({ id: uid(), name })),
    catTodo:  SEED_TODO.map(([text, offset]) => ({ id: uid(), text, offset })),
    updatedAt: now()
  };
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if (!raw) return blankStore();
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.trips)) return blankStore();
    /* v1 items had no owner — treat them as shared */
    s.trips.forEach(t => (t.take || []).forEach(i => { if (!i.who) i.who = EVERYONE; }));
    return s;
  }catch(e){ console.warn("Stored data unreadable, starting fresh", e); return blankStore(); }
}
function save(){
  S.updatedAt = now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ alert("Couldn't save — device storage is full or blocked."); }
}

const trip = () => S.trips.find(t => t.id === S.activeTripId) || null;
const touch = o => { o.updatedAt = now(); };
const travellers = () => (trip()?.travellers || []);

function newTrip(){
  return { id: uid(), name: "", dest: "", depart: "", ret: "", travellers: [],
           take: [], bring: [], todo: [], updatedAt: now() };
}

/* ---------- dates ---------- */
function days(from, to){
  if (!from || !to) return null;
  return Math.round((new Date(to + "T00:00") - new Date(from + "T00:00")) / 86400000);
}
function fmt(iso){
  if (!iso) return "—";
  return new Date(iso + "T00:00").toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" });
}
function dueDate(depart, offset){
  if (!depart) return null;
  const d = new Date(depart + "T00:00");
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const initials = n => n.trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();

/* ============================================================
   Sign in
   ============================================================ */
function needsSignIn(){
  const t = trip();
  if (!t) return false;
  if (!t.travellers.length) return false;          /* solo trip — no sign-in needed */
  return !t.travellers.includes(user);
}

function viewSignIn(){
  const t = trip();
  return `<div class="signin">
    <h2>Who's packing?</h2>
    <p>Your packing list is your own. Shared items — documents, car kit —
       show on everybody's list.</p>
    <div class="people">
      ${t.travellers.map(n => `<button class="person" data-act="signin" data-name="${esc(n)}">
        <span class="avatar">${esc(initials(n))}</span>${esc(n)}</button>`).join("")}
    </div>
    <p class="hint" style="margin-top:16px">Names come from the Travelling field on the trip.
       Change them with the pencil at the top.</p>
  </div>`;
}

/* ============================================================
   Header
   ============================================================ */
function renderHeader(){
  const sel = document.getElementById("tripSel");
  const cnt = document.getElementById("tripCount");
  const today = todayISO();

  const opt = t => {
    const when = t.depart ? new Date(t.depart + "T00:00").toLocaleDateString("en-GB", { month:"short", year:"numeric" }) : "no dates";
    return `<option value="${t.id}"${t.id === S.activeTripId ? " selected" : ""}>${esc(t.name || "Untitled trip")} — ${when}</option>`;
  };

  if (!S.trips.length){
    sel.innerHTML = `<option>No trips yet</option>`;
    cnt.textContent = "Tap + to set up your first trip";
  } else {
    const sorted = [...S.trips].sort((a, b) => (a.depart || "9999").localeCompare(b.depart || "9999"));
    const coming = sorted.filter(t => !t.depart || t.depart >= today);
    const past   = sorted.filter(t => t.depart && t.depart < today).reverse();
    sel.innerHTML =
      (coming.length ? `<optgroup label="Coming up">${coming.map(opt).join("")}</optgroup>` : "") +
      (past.length   ? `<optgroup label="Been and gone">${past.map(opt).join("")}</optgroup>` : "");
    cnt.textContent = S.trips.length === 1
      ? "1 trip saved · tap + to add another"
      : `${S.trips.length} trips saved · tap the name to switch between them`;
  }

  const chip = document.getElementById("userChip");
  if (user && travellers().includes(user)){
    chip.hidden = false;
    chip.innerHTML = `<b>${esc(user)}</b><button data-act="signout">Not you?</button>`;
  } else {
    chip.hidden = true;
  }

  const t = trip(), j = document.getElementById("journey");
  if (!t){ j.innerHTML = ""; return; }

  const out = days(todayISO(), t.depart);
  const len = days(t.depart, t.ret);
  let pos = 0, box;

  if (out === null){
    box = `<div class="jbox quiet"><b>No dates</b><span>tap the pencil</span></div>`;
  } else if (out > 1){
    pos = Math.max(4, 100 - Math.min(100, out));
    box = `<div class="jbox"><b>${out}</b><span>days to go</span></div>`;
  } else if (out === 1){
    pos = 96;
    box = `<div class="jbox"><b>1</b><span>day to go</span></div>`;
  } else if (out === 0){
    pos = 100;
    box = `<div class="jbox"><b>Today</b><span>we leave</span></div>`;
  } else if (len !== null && -out <= len){
    pos = 100;
    box = `<div class="jbox"><b>Day ${-out + 1}</b><span>of ${len + 1}</span></div>`;
  } else {
    pos = 100;
    box = `<div class="jbox quiet"><b>Home</b><span>trip finished</span></div>`;
  }

  j.innerHTML = `
    <div class="jrow">
      <div class="jend">Leaving<b>${fmt(t.depart)}</b></div>
      ${box}
      <div class="jend right">${esc(t.dest || "Back home")}<b>${fmt(t.ret)}</b></div>
    </div>
    <div class="jtrack"><div class="jfill" style="width:${pos}%"></div><div class="jdot" style="left:${pos}%"></div></div>`;
}

/* ---------- tabs ---------- */
nav{
  display:flex;gap:2px;overflow-x:auto;background:var(--card);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:19;
  scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto;border:0;background:none;padding:11px 13px;
  font-size:14.5px;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;
}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

main{padding:var(--pad);max-width:640px;margin:0 auto}

}
.cardhead h3{font-size:14.5px}
.count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.addrow{display:flex;gap:6px;margin-bottom:6px}

.addrow input,.addrow select{
  flex:1;min-width:0;padding:11px 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);
}
.btn{
  border:0;background:var(--accent);color:#fff;border-radius:8px;
  padding:11px 15px;font-weight:600;cursor:pointer;flex:0 0 auto;
}
.btn:active{opacity:.85}
.btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--line)}

ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
ul.list li:last-child{border-bottom:0}
ul.list li.done .txt{color:var(--muted);text-decoration:line-through}
.chk{
  flex:0 0 22px;width:22px;height:22px;margin-top:1px;border:1.5px solid var(--line);
  border-radius:6px;background:var(--card);cursor:pointer;font-size:14px;
  line-height:1;color:var(--accent);padding:0;
}
.chk[data-on="1"]{background:var(--accent);border-color:var(--accent);color:#fff}
.txt{flex:1;min-width:0;word-break:break-word}
.sub{display:block;font-size:12.5px;color:var(--muted)}
.sub.late{color:var(--warn);font-weight:600}
.datebtn{
  display:block;margin-top:2px;padding:0 0 1px;border:0;border-bottom:1px dashed var(--line);
  background:none;font-size:12.5px;color:var(--muted);cursor:pointer;text-align:left;
}
.datebtn.late{color:var(--warn);font-weight:600;border-bottom-color:var(--warn)}
.donehead{
  display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:11px 12px;border:0;background:#EFF6FD;cursor:pointer;
  font-size:14.5px;font-weight:600;color:var(--ink);text-align:left;
}
.donehead + ul.list{border-top:1px solid var(--line)}
.caret{
  width:9px;height:9px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);
  transform:translateY(-2px) rotate(45deg);transition:transform .15s;
}
.caret.up{transform:translateY(2px) rotate(-135deg)}
@media (prefers-reduced-motion:reduce){.caret{transition:none}}
.del{flex:0 0 auto;border:0;background:none;color:var(--muted);font-size:17px;cursor:pointer;padding:0 2px;line-height:1}

.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px dashed var(--line)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip:active{background:var(--accent-soft);border-color:var(--accent)}
.chiphead{font-size:12.5px;color:var(--muted);padding:10px 12px 0}

.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14.5px}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:3px}

.stub{padding:20px 14px}
.stub h3{font-size:16px;margin-bottom:6px}
.stub p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.stub ul{margin:0;padding-left:19px;color:var(--muted);font-size:14.5px}
.stub li{margin-bottom:5px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.toolbar .btn{flex:1 1 auto}

/* ---------- sign in ---------- */
.signin{max-width:420px;margin:34px auto;text-align:center}
.signin h2{font-family:Georgia,serif;font-size:24px;margin-bottom:6px}
.signin p{color:var(--muted);font-size:14.5px;margin:0 0 20px}
.people{display:flex;flex-direction:column;gap:9px}
.person{
  border:1px solid var(--line);background:var(--card);border-radius:var(--r);
  padding:15px;font-size:17px;cursor:pointer;color:var(--ink);text-align:left;
  display:flex;align-items:center;gap:12px;
}
.person:active{border-color:var(--accent);background:var(--accent-soft)}
.avatar{
  flex:0 0 34px;width:34px;height:34px;border-radius:50%;background:var(--accent);
  color:#fff;display:grid;place-items:center;font-size:15px;font-weight:600;
}

dialog{border:0;border-radius:14px;padding:0;width:min(94vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(14,42,71,.5)}
.dlgbody{padding:16px}
.dlgbody h2{font-size:17px;margin-bottom:12px}
.field{margin-bottom:11px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.hint{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
.dlgfoot{display:flex;gap:8px;padding:0 16px 16px}
.dlgfoot .btn{flex:1}
</style>
</head>
<body>

<header id="hdr" hidden>
  <div class="tripbar">
    <div class="trippick"><select id="tripSel" aria-label="Choose which trip to open"></select></div>
    <button class="iconbtn" id="editTrip" title="Edit this trip">&#9998;</button>
    <button class="iconbtn" id="newTrip" title="New trip">+</button>
  </div>
  <div class="tripcount" id="tripCount"></div>
  <div class="userchip" id="userChip"></div>
  <div class="journey" id="journey"></div>
</header>

<nav id="tabs" role="tablist" hidden></nav>
<main id="view"></main>

<dialog id="tripDlg">
  <form method="dialog" class="dlgbody">
    <h2 id="dlgTitle">New trip</h2>
    <div class="field"><label for="f_name">Trip name</label><input id="f_name" placeholder="Christmas in Yorkshire"></div>
    <div class="field"><label for="f_dest">Destination</label><input id="f_dest" placeholder="Harrogate"></div>
    <div class="field"><label for="f_dep">Leaving</label><input id="f_dep" type="date"></div>
    <div class="field"><label for="f_ret">Coming back</label><input id="f_ret" type="date"></div>
    <div class="field"><label for="f_trav">Travelling (comma separated)</label><input id="f_trav" placeholder="Clive, Sue"></div>
    <p class="hint">Everyone named here gets their own packing list and can sign in on this device.</p>
  </form>
  <div class="dlgfoot">
    <button class="btn ghost" id="dlgDelete" type="button">Delete trip</button>
    <button class="btn" id="dlgSave" type="button">Save trip</button>
  </div>
</dialog>

<dialog id="dateDlg">
  <div class="dlgbody">
    <h2>When should this be done?</h2>
    <p class="hint" id="dateJob" style="margin:-8px 0 12px"></p>
    <div class="field"><label for="f_due">Date</label><input id="f_due" type="date"></div>
    <p class="hint" id="dateRel"></p>
  </div>
  <div class="dlgfoot">
    <button class="btn ghost" id="dateCancel" type="button">Cancel</button>
    <button class="btn" id="dateSave" type="button">Set date</button>
  </div>
</dialog>

<script>
"use strict";
/* ============================================================
   Trip Planner — v2
   · Sky-blue palette
   · Sign-in by traveller; the To take list is per person
   · Save as a copy, so old trips stay available for comparison
   Storage: localStorage. Sync-ready model — every record has an
   id + updatedAt and the whole store serialises to one blob.
   ============================================================ */

const KEY = "trips.v1";
const UKEY = "trips.user";          /* who is signed in on THIS device */
const EVERYONE = "Everyone";

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => new Date().toISOString();
const todayISO = () => new Date().toISOString().slice(0, 10);

const TAKE_CATS = ["Documents","Clothes","Toiletries","Tech","Medical","Car","Pet","Other"];

const SEED_TAKE = [
  ["Passports","Documents"],["Driving licence","Documents"],["Insurance details","Documents"],
  ["Boarding passes","Documents"],["Booking confirmations","Documents"],
  ["Underwear","Clothes"],["Socks","Clothes"],["Waterproof","Clothes"],["Walking shoes","Clothes"],
  ["Smart outfit","Clothes"],["Swimming things","Clothes"],
  ["Toothbrush","Toiletries"],["Razor","Toiletries"],["Sun cream","Toiletries"],["Shampoo","Toiletries"],
  ["Phone charger","Tech"],["Plug adapter","Tech"],["Power bank","Tech"],["Headphones","Tech"],
  ["Camera","Tech"],["Kindle","Tech"],
  ["Prescriptions","Medical"],["Painkillers","Medical"],["Plasters","Medical"],
  ["Warning triangles","Car"],["Hi-vis vests","Car"],["Spare bulbs","Car"],["Breakdown cover card","Car"],
  ["Lead and harness","Pet"],["Food and bowls","Pet"],["Vaccination record","Pet"],
  ["Sunglasses","Other"],["Umbrella","Other"],["Cash","Other"]
];
const SEED_BRING = ["Olive oil","Turrón","Cheese","Tea bags","Marmite","Books","Presents","Wine"];
const SEED_TODO = [
  ["Check passports are still in date", -90],
  ["Sort travel insurance", -45],
  ["Book pet care or house sitter", -30],
  ["Tell the bank we're away", -21],
  ["Re-read all booking confirmations", -14],
  ["Arrange currency", -10],
  ["Stop the post and deliveries", -7],
  ["Check in online", -2],
  ["Charge everything", -1],
  ["Empty the fridge", -1],
  ["Bins out", -1],
  ["Water off, windows shut, lock up", 0]
];

/* ---------- store ---------- */
let S = load();
let user = localStorage.getItem(UKEY) || "";

function blankStore(){
  return {
    v: 2, activeTripId: null, trips: [],
    catTake:  SEED_TAKE.map(([name, cat]) => ({ id: uid(), name, cat })),
    catBring: SEED_BRING.map(name => ({ id: uid(), name })),
    catTodo:  SEED_TODO.map(([text, offset]) => ({ id: uid(), text, offset })),
    updatedAt: now()
  };
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if (!raw) return blankStore();
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.trips)) return blankStore();
    /* v1 items had no owner — treat them as shared */
    s.trips.forEach(t => (t.take || []).forEach(i => { if (!i.who) i.who = EVERYONE; }));
    return s;
  }catch(e){ console.warn("Stored data unreadable, starting fresh", e); return blankStore(); }
}
function save(){
  S.updatedAt = now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ alert("Couldn't save — device storage is full or blocked."); }
}

const trip = () => S.trips.find(t => t.id === S.activeTripId) || null;
const touch = o => { o.updatedAt = now(); };
const travellers = () => (trip()?.travellers || []);

function newTrip(){
  return { id: uid(), name: "", dest: "", depart: "", ret: "", travellers: [],
           take: [], bring: [], todo: [], updatedAt: now() };
}

/* ---------- dates ---------- */
function days(from, to){
  if (!from || !to) return null;
  return Math.round((new Date(to + "T00:00") - new Date(from + "T00:00")) / 86400000);
}
function fmt(iso){
  if (!iso) return "—";
  return new Date(iso + "T00:00").toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" });
}
function dueDate(depart, offset){
  if (!depart) return null;
  const d = new Date(depart + "T00:00");
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const initials = n => n.trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();

/* ============================================================
   Sign in
   ============================================================ */
function needsSignIn(){
  const t = trip();
  if (!t) return false;
  if (!t.travellers.length) return false;          /* solo trip — no sign-in needed */
  return !t.travellers.includes(user);
}

function viewSignIn(){
  const t = trip();
  return `<div class="signin">
    <h2>Who's packing?</h2>
    <p>Your packing list is your own. Shared items — documents, car kit —
       show on everybody's list.</p>
    <div class="people">
      ${t.travellers.map(n => `<button class="person" data-act="signin" data-name="${esc(n)}">
        <span class="avatar">${esc(initials(n))}</span>${esc(n)}</button>`).join("")}
    </div>
    <p class="hint" style="margin-top:16px">Names come from the Travelling field on the trip.
       Change them with the pencil at the top.</p>
  </div>`;
}

/* ============================================================
   Header
   ============================================================ */
function renderHeader(){
  const sel = document.getElementById("tripSel");
  const cnt = document.getElementById("tripCount");
  const today = todayISO();

  const opt = t => {
    const when = t.depart ? new Date(t.depart + "T00:00").toLocaleDateString("en-GB", { month:"short", year:"numeric" }) : "no dates";
    return `<option value="${t.id}"${t.id === S.activeTripId ? " selected" : ""}>${esc(t.name || "Untitled trip")} — ${when}</option>`;
  };

  if (!S.trips.length){
    sel.innerHTML = `<option>No trips yet</option>`;
    cnt.textContent = "Tap + to set up your first trip";
  } else {
    const sorted = [...S.trips].sort((a, b) => (a.depart || "9999").localeCompare(b.depart || "9999"));
    const coming = sorted.filter(t => !t.depart || t.depart >= today);
    const past   = sorted.filter(t => t.depart && t.depart < today).reverse();
    sel.innerHTML =
      (coming.length ? `<optgroup label="Coming up">${coming.map(opt).join("")}</optgroup>` : "") +
      (past.length   ? `<optgroup label="Been and gone">${past.map(opt).join("")}</optgroup>` : "");
    cnt.textContent = S.trips.length === 1
      ? "1 trip saved · tap + to add another"
      : `${S.trips.length} trips saved · tap the name to switch between them`;
  }

  const chip = document.getElementById("userChip");
  if (user && travellers().includes(user)){
    chip.hidden = false;
    chip.innerHTML = `<b>${esc(user)}</b><button data-act="signout">Not you?</button>`;
  } else {
    chip.hidden = true;
  }

  const t = trip(), j = document.getElementById("journey");
  if (!t){ j.innerHTML = ""; return; }

  const out = days(todayISO(), t.depart);
  const len = days(t.depart, t.ret);
  let pos = 0, note = "";

  if (out === null){ note = "Add your dates to start the countdown"; }
  else if (out > 0){ note = out === 1 ? "Leaving tomorrow" : `${out} days to go`; pos = Math.max(4, 100 - Math.min(100, out)); }
  else if (len !== null && -out <= len){ note = `Day ${-out + 1} of ${len + 1}`; pos = 100; }
  else { note = "This trip has been and gone"; pos = 100; }

  j.innerHTML = `
    <div class="jrow">
      <div>Leaving<b>${fmt(t.depart)}</b></div>
      <div>${esc(t.dest || "Back home")}<b>${fmt(t.ret)}</b></div>
    </div>
    <div class="jtrack"><div class="jfill" style="width:${pos}%"></div><div class="jdot" style="left:${pos}%"></div></div>
    <div class="jnote">${esc(note)}${len !== null && len >= 0 ? ` · ${len + 1} days away` : ""}</div>`;
}

/* ---------- tabs ---------- */
const TABS = [["take","To take"],["bring","Bring back"],["todo","Before we go"],
              ["itin","Itinerary"],["book","Bookings"],["money","Money"]];
let tab = "take";
function renderTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(([k, label]) =>
    `<button role="tab" data-tab="${k}" aria-selected="${k === tab}">${label}</button>`).join("");
}

/* ============================================================
   Render
   ============================================================ */
function render(){
  const hdr = document.getElementById("hdr"), nav = document.getElementById("tabs"), v = document.getElementById("view");

  if (!S.trips.length){
    hdr.hidden = false; nav.hidden = true;
    renderHeader();
    v.innerHTML = `
      <div class="card"><div class="empty">
        <b>Nothing on this device yet</b>
        Start a new trip with + at the top, or bring across trips you've
        already set up on another device.
      </div>
      <div class="chips" style="border-top:1px solid var(--line);padding:12px">
        <button class="btn" data-act="import" style="flex:1">Restore from a backup file</button>
      </div></div>
      <p class="count" style="text-align:center">Export a backup on the other device first —
         it saves a single .json file you can send over or copy across.</p>`;
    return;
  }
  renderHeader();
  hdr.hidden = false;

  if (needsSignIn()){ nav.hidden = true; v.innerHTML = viewSignIn(); return; }

  nav.hidden = false; renderTabs();
  const t = trip();
  if (tab === "take")  v.innerHTML = viewTake(t);
  if (tab === "bring") v.innerHTML = viewBring(t);
  if (tab === "todo")  v.innerHTML = viewTodo(t);
  if (tab === "itin")  v.innerHTML = stub("Itinerary","Everything with a date and time, in the order it happens.",
    ["Flights, check-ins and check-outs pulled from Bookings",
     "Car legs with distance, driving time, tolls and fuel",
     "Ferry and tunnel crossings","A day-by-day view you can read on the road"]);
  if (tab === "book")  v.innerHTML = stub("Bookings","Enter each booking once; it feeds the itinerary and the totals.",
    ["Flights, hotels, car hire, ferries, activities",
     "Reference numbers and a link to the confirmation email",
     "Deposit paid, balance due, and when it's due",
     "Passport, insurance and licence expiry dates"]);
  if (tab === "money") v.innerHTML = stub("Money","Adds up every booking and expense so you know where you stand.",
    ["Total cost, paid so far, still outstanding",
     "Euros and sterling with one rate per trip","Split by person",
     "Loose spending alongside the big bookings"]);
}

function stub(title, lead, items){
  return `<div class="card"><div class="stub"><h3>${title}</h3><p>${lead}</p>
    <ul>${items.map(i => `<li>${i}</li>`).join("")}</ul></div></div>` + tools();
}

/* ---------- To take (per person) ---------- */
function ownerOptions(selected){
  const list = [EVERYONE, ...travellers()];
  if (!list.length) return `<option>${EVERYONE}</option>`;
  return list.map(n => `<option${n === selected ? " selected" : ""}>${esc(n)}</option>`).join("");
}

function myTake(t){
  if (!t.travellers.length) return t.take;
  return t.take.filter(i => i.who === user || i.who === EVERYONE);
}

function viewTake(t){
  const mine = myTake(t);
  const packed = mine.filter(i => i.packed).length;
  const whoLabel = t.travellers.length ? `${esc(user)}'s list` : "Packing list";

  let html = `
    <div class="addrow">
      <input id="takeIn" placeholder="Add something to take" autocomplete="off">
      <button class="btn" data-act="addTake">Add</button>
    </div>
    <div class="addrow second">
      <select id="takeCat" aria-label="Category">${TAKE_CATS.map(c => `<option>${c}</option>`).join("")}</select>
      <select id="takeWho" aria-label="Whose item">${ownerOptions(t.travellers.length ? user : EVERYONE)}</select>
    </div>`;

  if (!mine.length){
    html += `<div class="card"><div class="empty"><b>Nothing on your list yet</b>
      Tap a suggestion below, or type your own above.</div></div>`;
  } else {
    html += `<div class="card"><div class="cardhead"><h3>${whoLabel}</h3>
      <span class="count">${packed} of ${mine.length} packed</span></div>
      <div class="jtrack" style="margin:0"><div class="jfill" style="width:${packed / mine.length * 100}%"></div></div></div>`;

    TAKE_CATS.forEach(cat => {
      const items = mine.filter(i => i.cat === cat);
      if (!items.length) return;
      const p = items.filter(i => i.packed).length;
      html += `<div class="card">
        <div class="cardhead"><h3>${cat}</h3><span class="count">${p}/${items.length}</span></div>
        <ul class="list">${items.map(i => `
          <li class="${i.packed ? "done" : ""}">
            <button class="chk" data-on="${i.packed ? 1 : 0}" data-act="tglTake" data-id="${i.id}"
              aria-label="Mark ${esc(i.name)} packed">${i.packed ? "&#10003;" : ""}</button>
            <span class="txt">${esc(i.name)}${i.who === EVERYONE && t.travellers.length ? `<span class="sub">Shared</span>` : ""}</span>
            <button class="del" data-act="delTake" data-id="${i.id}" aria-label="Remove">&times;</button>
          </li>`).join("")}</ul></div>`;
    });
  }

  const onList = new Set(mine.map(i => i.name.toLowerCase()));
  const sugg = S.catTake.filter(c => !onList.has(c.name.toLowerCase())).slice(0, 30);
  if (sugg.length){
    html += `<div class="card"><div class="chiphead">Things you usually take</div>
      <div class="chips">${sugg.map(c => `<button class="chip" data-act="quickTake" data-id="${c.id}">${esc(c.name)}</button>`).join("")}</div></div>`;
  }
  return html + tools();
}

/* ---------- Bring back (shared) ---------- */
function viewBring(t){
  const got = t.bring.filter(i => i.got).length;
  let html = `
    <div class="addrow second">
      <input id="bringIn" placeholder="Add something to bring back" autocomplete="off">
      <button class="btn" data-act="addBring">Add</button>
    </div>`;

  if (!t.bring.length){
    html += `<div class="card"><div class="empty"><b>Nothing to bring back yet</b>
      Entirely separate from what you take — things to buy, collect or carry home.
      Tap a suggestion below to start.</div></div>`;
  } else {
    html += `<div class="card">
      <div class="cardhead"><h3>Bring back</h3><span class="count">${got} of ${t.bring.length} got</span></div>
      <ul class="list">${t.bring.map(i => `
        <li class="${i.got ? "done" : ""}">
          <button class="chk" data-on="${i.got ? 1 : 0}" data-act="tglBring" data-id="${i.id}"
            aria-label="Mark ${esc(i.name)} got">${i.got ? "&#10003;" : ""}</button>
          <span class="txt">${esc(i.name)}${i.who ? `<span class="sub">For ${esc(i.who)}</span>` : ""}</span>
          <button class="del" data-act="delBring" data-id="${i.id}" aria-label="Remove">&times;</button>
        </li>`).join("")}</ul></div>`;
  }

  const onList = new Set(t.bring.map(i => i.name.toLowerCase()));
  const sugg = S.catBring.filter(c => !onList.has(c.name.toLowerCase())).slice(0, 30);
  if (sugg.length){
    html += `<div class="card"><div class="chiphead">Things you usually bring back</div>
      <div class="chips">${sugg.map(c => `<button class="chip" data-act="quickBring" data-id="${c.id}">${esc(c.name)}</button>`).join("")}</div></div>`;
  }
  return html + tools();
}

/* ---------- Before we go (shared) ---------- */
function todoDue(t, i){ return i.due || dueDate(t.depart, i.offset ?? 0); }

function whenLabel(due){
  if (!due) return { text: "Tap to set a date", late: false };
  const left = days(todayISO(), due);
  if (left < 0)  return { text: `Overdue — was ${fmt(due)}`, late: true };
  if (left === 0) return { text: "Today", late: false };
  if (left === 1) return { text: "Tomorrow", late: false };
  return { text: `${fmt(due)} · in ${left} days`, late: false };
}

let showDone = false;

function todoRow(t, i){
  const w = whenLabel(todoDue(t, i));
  const late = !i.done && w.late;
  return `<li class="${i.done ? "done" : ""}">
    <button class="chk" data-on="${i.done ? 1 : 0}" data-act="tglTodo" data-id="${i.id}" aria-label="Mark done">${i.done ? "&#10003;" : ""}</button>
    <span class="txt">${esc(i.text)}
      <button class="datebtn ${late ? "late" : ""}" data-act="pickDate" data-id="${i.id}"
        aria-label="Change the date for ${esc(i.text)}">${w.text}</button></span>
    <button class="del" data-act="delTodo" data-id="${i.id}" aria-label="Remove">&times;</button>
  </li>`;
}

function viewTodo(t){
  const byDate = (a, b) => (todoDue(t, a) || "9999-12-31").localeCompare(todoDue(t, b) || "9999-12-31");
  const open = t.todo.filter(i => !i.done).sort(byDate);
  const done = t.todo.filter(i => i.done).sort(byDate);

  let html = `
    <div class="addrow second">
      <input id="todoIn" placeholder="Add a job" autocomplete="off">
      <button class="btn" data-act="addTodo">Add</button>
    </div>`;

  if (!t.todo.length){
    html += `<div class="card"><div class="empty"><b>Nothing to do yet</b>
      Add a job above, or load your usual list below. You choose the date for each one.</div></div>`;
  } else if (!open.length){
    html += `<div class="card"><div class="empty"><b>All done</b>
      Every job on the list is ticked off.</div></div>`;
  } else {
    html += `<div class="card">
      <div class="cardhead"><h3>Still to do</h3><span class="count">${open.length} left of ${t.todo.length}</span></div>
      <ul class="list">${open.map(i => todoRow(t, i)).join("")}</ul></div>`;
  }

  if (done.length){
    html += `<div class="card">
      <button class="donehead" data-act="tglShowDone" aria-expanded="${showDone}">
        <span>Done<span class="count" style="margin-left:7px">${done.length}</span></span>
        <span class="caret ${showDone ? "up" : ""}"></span>
      </button>
      ${showDone ? `<ul class="list">${done.map(i => todoRow(t, i)).join("")}</ul>` : ""}</div>`;
  }

  const onList = new Set(t.todo.map(i => i.text.toLowerCase()));
  const sugg = S.catTodo.filter(c => !onList.has(c.text.toLowerCase()));
  if (sugg.length){
    html += `<div class="card"><div class="chiphead">Your usual jobs — tap one and pick its date</div>
      <div class="chips">${sugg.map(c => `<button class="chip" data-act="quickTodo" data-id="${c.id}">${esc(c.text)}</button>`).join("")}
        <button class="chip" data-act="allTodo" style="border-color:var(--accent);color:var(--accent)">Add all, dates as usual</button></div></div>`;
  }
  return html + tools();
}

function tools(){
  return `<div class="toolbar">
    <button class="btn ghost" data-act="export">Export a backup</button>
    <button class="btn ghost" data-act="import">Load a backup</button>
  </div>
  <p class="count" style="margin-top:8px">Everything saves as you type. Every trip stays in the list at the top until you delete it.</p>`;
}

/* ---------- catalogue learning ---------- */
const learnTake = (name, cat) => { if (!S.catTake.some(c => c.name.toLowerCase() === name.toLowerCase())) S.catTake.push({ id: uid(), name, cat }); };
const learnBring = name => { if (!S.catBring.some(c => c.name.toLowerCase() === name.toLowerCase())) S.catBring.push({ id: uid(), name }); };
const learnTodo = (text, offset) => { if (!S.catTodo.some(c => c.text.toLowerCase() === text.toLowerCase())) S.catTodo.push({ id: uid(), text, offset }); };

/* ============================================================
   Actions
   ============================================================ */
document.addEventListener("click", e => {
  const tabBtn = e.target.closest("nav button");
  if (tabBtn){ tab = tabBtn.dataset.tab; render(); return; }

  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act, id = b.dataset.id, t = trip();

  if (a === "signin"){ user = b.dataset.name; localStorage.setItem(UKEY, user); render(); return; }
  if (a === "signout"){ user = ""; localStorage.removeItem(UKEY); render(); return; }
  if (a === "export") return doExport();
  if (a === "import") return doImport();
  if (a === "tglShowDone"){ showDone = !showDone; render(); return; }
  if (!t) return;

  const val = s => { const el = document.getElementById(s); return el ? el.value.trim() : ""; };

  switch (a){
    case "addTake": {
      const name = val("takeIn"); if (!name) return;
      const cat = document.getElementById("takeCat").value;
      const who = document.getElementById("takeWho").value;
      t.take.push({ id: uid(), name, cat, who, packed: false, updatedAt: now() });
      learnTake(name, cat); touch(t); break;
    }
    case "quickTake": {
      const c = S.catTake.find(x => x.id === id); if (!c) return;
      const who = t.travellers.length ? user : EVERYONE;
      t.take.push({ id: uid(), name: c.name, cat: c.cat, who, packed: false, updatedAt: now() });
      touch(t); break;
    }
    case "tglTake": { const i = t.take.find(x => x.id === id); i.packed = !i.packed; touch(i); touch(t); break; }
    case "delTake": { t.take = t.take.filter(x => x.id !== id); touch(t); break; }

    case "addBring": {
      const name = val("bringIn"); if (!name) return;
      t.bring.push({ id: uid(), name, who: "", got: false, note: "", updatedAt: now() });
      learnBring(name); touch(t); break;
    }
    case "quickBring": {
      const c = S.catBring.find(x => x.id === id); if (!c) return;
      t.bring.push({ id: uid(), name: c.name, who: "", got: false, note: "", updatedAt: now() });
      touch(t); break;
    }
    case "tglBring": { const i = t.bring.find(x => x.id === id); i.got = !i.got; touch(i); touch(t); break; }
    case "delBring": { t.bring = t.bring.filter(x => x.id !== id); touch(t); break; }

    case "addTodo": {
      const text = val("todoIn"); if (!text) return;
      const known = S.catTodo.find(x => x.text.toLowerCase() === text.toLowerCase());
      const offset = known ? known.offset : -7;
      const item = { id: uid(), text, offset, done: false, updatedAt: now() };
      t.todo.push(item); learnTodo(text, offset); touch(t);
      save(); render(); openDate(item.id);
      document.getElementById("todoIn").value = "";
      return;
    }
    case "quickTodo": {
      const c = S.catTodo.find(x => x.id === id); if (!c) return;
      const item = { id: uid(), text: c.text, offset: c.offset, done: false, updatedAt: now() };
      t.todo.push(item); touch(t);
      save(); render(); openDate(item.id);
      return;
    }
    case "pickDate": return openDate(id);
    case "allTodo": {
      const on = new Set(t.todo.map(i => i.text.toLowerCase()));
      S.catTodo.filter(c => !on.has(c.text.toLowerCase())).forEach(c =>
        t.todo.push({ id: uid(), text: c.text, offset: c.offset, done: false, updatedAt: now() }));
      touch(t); break;
    }
    case "tglTodo": { const i = t.todo.find(x => x.id === id); i.done = !i.done; touch(i); touch(t); break; }
    case "delTodo": { t.todo = t.todo.filter(x => x.id !== id); touch(t); break; }
    default: return;
  }
  save(); render();
  if (a.startsWith("add")){
    const box = document.getElementById(a === "addTake" ? "takeIn" : a === "addBring" ? "bringIn" : "todoIn");
    if (box) box.focus();
  }
});

document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const act = { takeIn:"addTake", bringIn:"addBring", todoIn:"addTodo" }[e.target.id];
  if (act) document.querySelector(`[data-act="${act}"]`).click();
});

/* ---------- due date picker ---------- */
const dateDlg = document.getElementById("dateDlg");
let dateId = null;

function openDate(itemId){
  const t = trip(); if (!t) return;
  const i = t.todo.find(x => x.id === itemId); if (!i) return;
  dateId = itemId;
  document.getElementById("dateJob").textContent = i.text;
  document.getElementById("f_due").value = todoDue(t, i) || todayISO();
  showRel();
  dateDlg.showModal();
}

function showRel(){
  const t = trip(), v = document.getElementById("f_due").value;
  const rel = document.getElementById("dateRel");
  if (!v || !t.depart){ rel.textContent = ""; return; }
  const d = days(v, t.depart);
  rel.textContent = d === 0 ? "The day you leave"
    : d > 0 ? `${d} day${d === 1 ? "" : "s"} before you leave`
            : `${-d} day${d === -1 ? "" : "s"} after you leave`;
}
document.getElementById("f_due").addEventListener("input", showRel);
document.getElementById("dateCancel").onclick = () => dateDlg.close();

document.getElementById("dateSave").onclick = () => {
  const t = trip(), i = t.todo.find(x => x.id === dateId);
  const v = document.getElementById("f_due").value;
  if (!i || !v){ dateDlg.close(); return; }

  if (t.depart){
    /* store as an offset so the job reuses correctly on the next trip */
    i.offset = -days(v, t.depart);
    delete i.due;
  } else {
    i.due = v;
  }
  touch(i); touch(t);

  /* remember this timing for next time */
  const c = S.catTodo.find(x => x.text.toLowerCase() === i.text.toLowerCase());
  if (c && i.offset !== undefined) c.offset = i.offset;

  save(); dateDlg.close(); render();
};

/* ---------- trip dialog ---------- */
const dlg = document.getElementById("tripDlg");
let editing = null;

function openTrip(t){
  editing = t;
  document.getElementById("dlgTitle").textContent = t ? "Edit trip" : "New trip";
  f_name.value = t ? t.name : "";
  f_dest.value = t ? t.dest : "";
  f_dep.value  = t ? t.depart : "";
  f_ret.value  = t ? t.ret : "";
  f_trav.value = t ? (t.travellers || []).join(", ") : "";
  document.getElementById("dlgDelete").style.display = t ? "" : "none";
  dlg.showModal();
}
document.getElementById("newTrip").onclick = () => openTrip(null);
document.getElementById("editTrip").onclick = () => { if (trip()) openTrip(trip()); };

document.getElementById("dlgSave").onclick = () => {
  const t = editing || newTrip();
  t.name = f_name.value.trim() || "Untitled trip";
  t.dest = f_dest.value.trim();
  t.depart = f_dep.value;
  t.ret = f_ret.value;
  t.travellers = f_trav.value.split(",").map(s => s.trim()).filter(Boolean);
  touch(t);
  if (!editing){ S.trips.push(t); S.activeTripId = t.id; }
  save(); dlg.close(); render();
};

document.getElementById("dlgDelete").onclick = () => {
  if (!editing) return;
  if (!confirm(`Delete "${editing.name}" and everything in it?`)) return;
  S.trips = S.trips.filter(x => x.id !== editing.id);
  S.activeTripId = S.trips.length ? S.trips[0].id : null;
  save(); dlg.close(); render();
};

document.getElementById("tripSel").onchange = e => { S.activeTripId = e.target.value; save(); render(); };

/* ---------- backup ---------- */
function doExport(){
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `trips-${todayISO()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function doImport(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let d;
      try{
        d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.trips)) throw new Error("not a trips backup");
      }catch(err){
        alert("That file isn't a trips backup — nothing has changed.");
        return;
      }
      d.trips.forEach(t => (t.take || []).forEach(i => { if (!i.who) i.who = EVERYONE; }));

      if (!S.trips.length){
        S = d;                                   /* empty device — just take it */
      } else {
        const merge = confirm(
          `That file holds ${d.trips.length} trip${d.trips.length === 1 ? "" : "s"}.\n\n` +
          "OK — add them to what's already here, keeping the newer version of anything that matches.\n" +
          "Cancel — replace everything on this device with the file.");
        if (merge) mergeIn(d); else S = d;
      }
      if (S.trips.length && !S.trips.some(t => t.id === S.activeTripId))
        S.activeTripId = S.trips[0].id;
      save(); render();
      alert(`Loaded. ${S.trips.length} trip${S.trips.length === 1 ? "" : "s"} on this device.`);
    };
    r.readAsText(f);
  };
  inp.click();
}

/* Merge by id, newest wins — the same rule the sync layer will use */
function mergeIn(d){
  d.trips.forEach(incoming => {
    const here = S.trips.find(t => t.id === incoming.id);
    if (!here){ S.trips.push(incoming); return; }
    if ((incoming.updatedAt || "") > (here.updatedAt || "")){
      S.trips[S.trips.indexOf(here)] = incoming;
    }
  });
  const addNew = (mine, theirs, key) =>
    (theirs || []).forEach(c => {
      if (!mine.some(x => String(x[key]).toLowerCase() === String(c[key]).toLowerCase())) mine.push(c);
    });
  addNew(S.catTake, d.catTake, "name");
  addNew(S.catBring, d.catBring, "name");
  addNew(S.catTodo, d.catTodo, "text");
}

/* ---------- go ---------- */
if (S.trips.length && !S.activeTripId) S.activeTripId = S.trips[0].id;
render();
</script>
